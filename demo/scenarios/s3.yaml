name: s3
description: Coffee routine learned from seeded plug history -> plug on shortly before usual time
# Before: python demo/seed_history.py, then in backend/:
#   uv run python -m app.storage.import_seed ../demo/seed/history.jsonl --align-to-today
# Friday 07:20, ten minutes before the usual ~07:30 coffee.
now_override: "2026-11-20T07:20:00"
devices: []   # empty = default house (simulator/home.json); a list replaces it (same spec format)
state:        # applied by sim_load_scenario after the reset, as physical events
  sim-cafe-cozinha: {power: "off"}
steps:
  - {wait: 2, say: "São 07:20 de um dia útil. Ninguém toca na máquina de café."}
expect:
  # auto + notify: the plug is switched on by the agent before the usual time.
  - {say: "A máquina de café liga sozinha", device: sim-cafe-cozinha, capability: power, value: "on", within: 180}
  - {say: "Está a aquecer", device: sim-cafe-cozinha, capability: instantPower, op: ">", value: 100, within: 180}
