[project]
name = "smart-home-agent"
version = "0.1.0"
description = "ATC Hackathon 2026 - Altice Labs: intelligence layer for the smart home over MCP"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "pydantic-ai",
    "mcp",
    "aiosqlite",
    "pyyaml",
    "httpx",
    "tzdata",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP007", "UP042", "E501"]

[tool.ruff.lint.per-file-ignores]
"app/schemas/__init__.py" = ["F401"]
