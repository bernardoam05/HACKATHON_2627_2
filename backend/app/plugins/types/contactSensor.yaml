type: contactSensor
displayName: Sensor de contacto
purpose: security
status: builtin
capabilities:
  - type: sensorState
    description: "Porta/janela: alarm = aberta, normal = fechada"
    writable: false
    autonomy: auto
  - type: tamperState
    description: "Adulteração do sensor (alarm = adulterado)"
    writable: false
    autonomy: auto
  - type: batteryStatus
    description: "Bateria (low/medium/high)"
    writable: false
    autonomy: auto
starterAutomations:
  - "Porta de entrada: detetar saída de casa"
