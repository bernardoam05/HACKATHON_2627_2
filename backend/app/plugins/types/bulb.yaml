type: bulb
displayName: Lâmpada
purpose: comfort
status: builtin
capabilities:
  - type: power
    description: "Liga/desliga (on/off)"
    writable: true
    autonomy: auto
  - type: brightness
    description: Intensidade 1-100
    writable: true
    autonomy: auto
  - type: temperature
    description: "Temperatura de cor 0-100 (0 = quente, 100 = fria)"
    writable: true
    autonomy: auto
  - type: workMode
    description: "Modo (white/colour/music/scene); não pode ser alterado por aqui"
    writable: false
    autonomy: auto
starterAutomations:
  - Baixar a luz quando a TV liga ao serão
  - "A luz acompanha a pessoa: quando aparece movimento numa divisão, acender a luz dessa divisão; quando a divisão de onde a pessoa saiu fica sem movimento, apagar a luz dela"
